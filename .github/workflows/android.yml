name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK yig'ish
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Nomini o'zgartirish
        run: cp app/build/outputs/apk/debug/app-debug.apk osmon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: osmon-apk
          path: android/osmon.apk
      - name: Releases bo'limiga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Osmon v${{ github.run_number }}
          files: android/osmon.apk
