<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a3d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Osmon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: bitta ustun — shahar, katta harorat, soatlik lenta, 16 kunlik ro'yxat */
:root{
  --bg:#eef3f6; --card:#ffffff; --fg:#0f2a3d; --muted:#5b7183; --line:#d6e1e8;
  --accent:#e0742b; --cold:#2f7fb8; --warm:#d4502a; --faint:#f5f8fa;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1823; --card:#12232f; --fg:#e7eff4; --muted:#8aa1b2; --line:#1f3646;
  --accent:#f0914e; --cold:#6cb3e6; --warm:#f07a55; --faint:#0f1f2a; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));}
main{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
main>*,section>*{min-width:0}
button,input{font:inherit;color:inherit}
.top{display:flex;gap:8px}
.top input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.top button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;cursor:pointer}
.top button:focus-visible,.top input:focus-visible,.res button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.res{display:grid;gap:4px}
.res button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.res small{color:var(--muted)}
.now{padding:8px 4px 4px}
.place{font-weight:700;font-size:17px}
.date{color:var(--muted);font-size:13px}
.big{display:flex;align-items:center;gap:12px;margin-top:8px}
.temp{font:600 76px/1 var(--display);letter-spacing:-.04em}
.big svg{width:64px;height:64px;flex:none}
.big>div{min-width:0;flex:1}
.desc{font-weight:600;font-size:17px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.facts div{background:var(--card);border-radius:12px;padding:8px 10px}
.facts b{display:block;font-variant-numeric:tabular-nums}
.facts span{color:var(--muted);font-size:12px}
h2{font:600 12px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 4px 0}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.h{flex:none;width:58px;background:var(--card);border-radius:12px;padding:8px 0;text-align:center;scroll-snap-align:start}
.h svg{width:26px;height:26px;display:block;margin:4px auto}
.h .t{font-weight:700;font-variant-numeric:tabular-nums}
.h small{display:block;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.h .p{color:var(--cold)}
.days{background:var(--card);border-radius:16px;overflow:hidden}
.d{display:grid;grid-template-columns:64px 28px 38px 1fr;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.d:first-child{border-top:0}
.d.far{background:var(--faint)}
.d.far .dn::after{content:"taxminiy";display:block;font-size:10px;color:var(--muted);font-weight:400}
.dn{font-weight:700;font-size:14px;line-height:1.2}
.dn small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.d svg{width:26px;height:26px}
.dp{color:var(--cold);font-size:12px;font-variant-numeric:tabular-nums}
.range{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:14px}
.range .lo{color:var(--muted);text-align:right}
.range .hi{font-weight:700}
.bar{position:relative;height:6px;background:var(--line);border-radius:3px}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--cold),var(--accent),var(--warm))}
.msg{color:var(--muted);padding:24px 4px;text-align:center}
.foot{color:var(--muted);font-size:12px;text-align:center}
.foot a{color:inherit}
/* jonli fon */
:root{--sky-day:rgba(120,180,225,.35);--sky-grey:rgba(120,135,150,.35);--sky-night:rgba(20,40,80,.35);--sun-glow:rgba(255,190,110,.45);--cloud:#ffffff;--snow:#ffffff}
@media (prefers-color-scheme:dark){:root{--sky-day:rgba(70,130,190,.35);--sky-grey:rgba(90,105,120,.4);--sky-night:rgba(40,70,140,.35);--sun-glow:rgba(255,170,90,.3);--cloud:#c9d6e0;--snow:#e8f0f6}}
.now{position:relative;overflow:hidden;background:var(--card);border-radius:20px;padding:16px 16px 14px!important;isolation:isolate}
#sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.facts div{background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(4px)}
.facts{gap:6px!important}
.mini{display:block;height:20px;width:auto;margin-bottom:4px;overflow:visible}
.wind path{fill:none;stroke:var(--cold);stroke-width:2;stroke-linecap:round;stroke-dasharray:6 4;animation:flow var(--dur) linear infinite}
.wind .w2{animation-duration:calc(var(--dur)*1.3)}.wind .w3{animation-duration:calc(var(--dur)*.8)}
@keyframes flow{to{stroke-dashoffset:-20}}
.hum .dropo{fill:none;stroke:var(--cold);stroke-width:1.5}
.hum .wave{fill:var(--cold);opacity:.7;animation:wave 2.4s linear infinite}
@keyframes wave{to{transform:translateX(10px)}}
.pres .arc,.sunarc .arc{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}
.pres .needle path{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.pres .needle circle{fill:var(--accent)}
@keyframes jitter{0%,100%{transform:rotate(var(--a))}30%{transform:rotate(calc(var(--a) + 5deg))}65%{transform:rotate(calc(var(--a) - 4deg))}}
.sunarc .dashed{stroke-dasharray:2 3;stroke-width:1.5}
.sunarc .ground{stroke:var(--muted);stroke-width:1}
.sunarc .sdot{fill:var(--accent);animation:pulse 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sunarc .mdot{fill:var(--muted)}
@keyframes pulse{50%{transform:scale(1.25)}}
/* jonli ikonkalar */
.wi .ray{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.wi .core{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
.wi .moon{transform-box:fill-box;transform-origin:center;animation:rock 6s ease-in-out infinite}
.wi .cl{animation:drift 5s ease-in-out infinite alternate}
.wi .rn{animation:drop 1s linear infinite}.wi .r2{animation-delay:-.35s}.wi .r3{animation-delay:-.7s}
.wi .sn{animation:flake 2.6s linear infinite}.wi .s2{animation-delay:-.9s}.wi .s3{animation-delay:-1.7s}
.wi .bolt{animation:flash 2.2s steps(1) infinite}
.wi .fg{animation:slide 3s ease-in-out infinite alternate}.wi .f2{animation-delay:-1.5s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rock{50%{transform:rotate(-10deg)}}
@keyframes drift{from{transform:translateX(-1px)}to{transform:translateX(1.5px)}}
@keyframes drop{0%{transform:translateY(-1px);opacity:0}20%{opacity:1}100%{transform:translateY(4px);opacity:0}}
@keyframes flake{0%{transform:translate(0,-1px);opacity:0}25%{opacity:1}60%{transform:translate(1px,2px)}100%{transform:translate(-1px,4px);opacity:0}}
@keyframes flash{0%,100%{opacity:1}40%{opacity:.25}45%{opacity:1}50%{opacity:.3}}
@keyframes slide{to{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){.wi *,.mini *{animation:none!important}}
.d{cursor:pointer;-webkit-tap-highlight-color:transparent}
.d:active{background:var(--line)}
.d:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;
  padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:14px}
.sh-top{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding-block:6px;z-index:1}
.back{background:var(--card);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sh-title{font-weight:700;font-size:17px;line-height:1.2}
.sh-title small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.sum{background:var(--card);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.sum b{font-size:15px}
.sum span{color:var(--muted);font-size:13px}
.sum.wet b{color:var(--cold)}
.hl{background:var(--card);border-radius:16px;overflow:hidden}
.hr{display:grid;grid-template-columns:46px 28px minmax(0,1fr) 44px 64px;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:14px}
.hr:first-child{border-top:0}
.hr svg{width:26px;height:26px}
.hr .tm{color:var(--muted);font-size:13px}
.hr .ds{font-size:13px;line-height:1.25}
.hr .ds small{display:block;color:var(--muted);font-size:11px}
.hr .tt{font-weight:700;text-align:right}
.hr .pr{text-align:right;font-size:12px;color:var(--muted);line-height:1.25}
.hr.wet{background:color-mix(in srgb,var(--cold) 12%,transparent)}
.hr.wet .pr{color:var(--cold);font-weight:600}
.hr.past{opacity:.45}
@media (max-width:380px){.temp{font-size:62px}.facts{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <input id="q" type="search" placeholder="Shahar qidirish: Urganch, Xiva..." autocomplete="off" aria-label="Shahar qidirish">
    <button id="loc" type="button" aria-label="Mening joylashuvim" title="Mening joylashuvim">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>
  <div id="res" class="res" hidden></div>
  <section id="app"><p class="msg">Yuklanmoqda...</p></section>
  <p class="foot">Ma'lumot: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>. Reklamasiz.</p>
</main>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh-title">
  <div class="sheet-in">
    <div class="sh-top">
      <button class="back" id="back" type="button" aria-label="Orqaga">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="sh-title" id="sh-title"></div>
    </div>
    <div id="sh-body"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const DEFAULT = {name:"Urganch", admin:"Xorazm", lat:41.55, lon:60.6333};
const W = ["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
const WS = ["Yak","Dush","Sesh","Chor","Pay","Jum","Shan"];
const M = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];

function codeInfo(c){
  if(c===0) return ["Ochiq osmon","sun"];
  if(c===1) return ["Asosan ochiq","sun"];
  if(c===2) return ["Qisman bulutli","part"];
  if(c===3) return ["Bulutli","cloud"];
  if(c===45||c===48) return ["Tuman","fog"];
  if(c>=51&&c<=57) return ["Mayda yomg'ir","rain"];
  if(c>=61&&c<=67) return [c>=65?"Kuchli yomg'ir":"Yomg'ir","rain"];
  if(c>=71&&c<=77) return ["Qor","snow"];
  if(c>=80&&c<=82) return ["Jala","rain"];
  if(c===85||c===86) return ["Qor yog'adi","snow"];
  if(c>=95) return ["Momaqaldiroq","storm"];
  return ["—","cloud"];
}
function icon(kind, day=true){
  const sun = day
    ? '<circle class="core" cx="12" cy="12" r="4.5" fill="var(--accent)"/><g class="ray" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g>'
    : '<path class="moon" d="M15 3.5a8.5 8.5 0 1 0 5.5 13A7 7 0 0 1 15 3.5z" fill="var(--muted)"/>';
  const cl = (x=0,y=0,f="var(--muted)") => `<g transform="translate(${x} ${y})"><path class="cl" d="M7 18h10a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.8 11 3.5 3.5 0 0 0 7 18z" fill="${f}"/></g>`;
  const body = {
    sun: sun,
    part: `<g transform="translate(-3 -3) scale(.8)">${sun}</g>${cl(2,2)}`,
    cloud: cl(0,0),
    fog: cl(0,-3)+'<g stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round"><path class="fg" d="M5 19h14"/><path class="fg f2" d="M7 22h10"/></g>',
    rain: cl(0,-3)+'<g stroke="var(--cold)" stroke-width="1.8" stroke-linecap="round"><path class="rn" d="M8 17l-1 3"/><path class="rn r2" d="M12 17l-1 3"/><path class="rn r3" d="M16 17l-1 3"/></g>',
    snow: cl(0,-3)+'<g fill="var(--cold)"><circle class="sn" cx="8" cy="18.5" r="1.3"/><circle class="sn s2" cx="12" cy="19.5" r="1.3"/><circle class="sn s3" cx="16" cy="18.5" r="1.3"/></g>',
    storm: cl(0,-3)+'<path class="bolt" d="M12.5 15l-3 4.5h2.5l-1.5 4 4-5.5h-2.5l1.5-3z" fill="var(--accent)"/>'
  }[kind];
  return `<svg class="wi" viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
}

// ---- jonli fon: yomg'ir, qor, bulut, quyosh, yulduz, tuman, chaqmoq ----
const SCENE = {kind:"sun", day:true, wind:2, clouds:0, rain:0, t0:performance.now(), parts:[], cl:[], stars:[], flash:0};
function setScene(kind, day, wind, cover, precip){
  const S = SCENE;
  S.kind = kind; S.day = day; S.wind = wind;
  S.clouds = kind==="sun" ? Math.round(cover/34) : kind==="part" ? 3 : 5;
  S.rain = kind==="rain" ? Math.min(220, 70 + precip*60) : kind==="storm" ? 220 : kind==="snow" ? 90 : 0;
  S.parts = []; S.cl = []; S.stars = [];
  for(let i=0;i<S.clouds;i++) S.cl.push({x:Math.random(), y:.08+Math.random()*.35, s:.6+Math.random()*.7, a:.35+Math.random()*.35});
  for(let i=0;i<40;i++) S.stars.push({x:Math.random(), y:Math.random()*.6, r:Math.random()*1.2+.3, p:Math.random()*6});
}
let sceneLast = performance.now();
function sceneFrame(ts){
  requestAnimationFrame(sceneFrame);
  const cv = document.getElementById("sky");
  if(!cv || document.hidden) { sceneLast = ts; return; }
  const dt = Math.min((ts - sceneLast)/1000, .1); sceneLast = ts;
  const S = SCENE, dpr = Math.min(devicePixelRatio||1, 2);
  const w = cv.clientWidth, h = cv.clientHeight;
  if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = w*dpr; cv.height = h*dpr; }
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const css = getComputedStyle(cv), col = n => css.getPropertyValue(n).trim();
  const t = ts/1000, still = REDUCE;

  // osmon rangi
  const sky = g.createLinearGradient(0,0,0,h);
  const dark = S.kind==="rain"||S.kind==="storm"||S.kind==="snow"||S.kind==="fog"||S.kind==="cloud";
  sky.addColorStop(0, S.day ? (dark ? col("--sky-grey") : col("--sky-day")) : col("--sky-night"));
  sky.addColorStop(1, "transparent");
  g.fillStyle = sky; g.fillRect(0,0,w,h);

  // yulduzlar va oy
  if(!S.day && S.clouds < 4){
    S.stars.forEach(s => { g.globalAlpha = .35 + .45*Math.abs(Math.sin(t*1.3 + s.p)); g.fillStyle = col("--fg");
      g.beginPath(); g.arc(s.x*w, s.y*h, s.r, 0, 6.283); g.fill(); });
    g.globalAlpha = 1;
  }
  // quyosh nurlari
  if(S.day && (S.kind==="sun"||S.kind==="part")){
    const sx = w - 56, sy = 50, pulse = still ? 0 : Math.sin(t*1.2)*4;
    const glow = g.createRadialGradient(sx,sy,0,sx,sy,120+pulse*3);
    glow.addColorStop(0, col("--sun-glow")); glow.addColorStop(1,"transparent");
    g.fillStyle = glow; g.fillRect(0,0,w,h);
    g.save(); g.translate(sx,sy); g.rotate(still ? 0 : t*.15);
    g.strokeStyle = col("--accent"); g.globalAlpha = .35; g.lineWidth = 2; g.lineCap = "round";
    for(let i=0;i<12;i++){ g.rotate(Math.PI/6); g.beginPath(); g.moveTo(34+pulse,0); g.lineTo(50+pulse,0); g.stroke(); }
    g.globalAlpha = 1; g.fillStyle = col("--accent"); g.beginPath(); g.arc(0,0,24,0,6.283); g.fill(); g.restore();
  }
  // bulutlar — shamol tezligiga qarab suzadi
  const speed = still ? 0 : (6 + S.wind*7);
  S.cl.forEach(c => {
    c.x += speed*dt/w*(.6 + c.s*.5);
    if(c.x > 1.25) { c.x = -.3; c.y = .08 + Math.random()*.35; }
    const x = c.x*w, y = c.y*h, r = 26*c.s;
    g.fillStyle = col("--cloud"); g.globalAlpha = c.a;
    g.beginPath();
    g.arc(x, y, r, 0, 6.283); g.arc(x + r*1.1, y + r*.15, r*.8, 0, 6.283);
    g.arc(x - r*1.05, y + r*.25, r*.7, 0, 6.283); g.arc(x + r*.3, y - r*.55, r*.75, 0, 6.283);
    g.fill(); g.globalAlpha = 1;
  });
  // tuman qatlamlari
  if(S.kind==="fog"){
    for(let i=0;i<4;i++){
      const y = h*(.35 + i*.17), off = still ? 0 : Math.sin(t*.3 + i)*40;
      const fg = g.createLinearGradient(0,y-20,0,y+20); fg.addColorStop(0,"transparent"); fg.addColorStop(.5,col("--cloud")); fg.addColorStop(1,"transparent");
      g.globalAlpha = .45; g.fillStyle = fg; g.fillRect(off-60, y-20, w+120, 40);
    }
    g.globalAlpha = 1;
  }
  // yomg'ir / qor
  if(S.rain && !still){
    const snow = S.kind==="snow", slant = Math.min(S.wind*12, 120);
    while(S.parts.length < S.rain) S.parts.push({x:Math.random()*(w+slant)-slant, y:Math.random()*-h, v:snow ? 30+Math.random()*30 : 380+Math.random()*220, l:8+Math.random()*10, p:Math.random()*6});
    g.strokeStyle = col("--cold"); g.fillStyle = col("--snow"); g.lineWidth = 1.3; g.lineCap = "round";
    S.parts.forEach(p => {
      p.y += p.v*dt; p.x += (snow ? Math.sin(t + p.p)*20 + slant*.3 : slant*.25)*dt*(snow?1:4)/4;
      if(p.y > h){ p.y = -10 - Math.random()*40; p.x = Math.random()*(w+slant)-slant; }
      if(snow){ g.globalAlpha = .85; g.beginPath(); g.arc(p.x, p.y, 1.6 + (p.l%3)*.5, 0, 6.283); g.fill(); }
      else { g.globalAlpha = .55; const dx = slant/400*p.l; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x + dx, p.y + p.l); g.stroke(); }
    });
    g.globalAlpha = 1;
  }
  // chaqmoq
  if(S.kind==="storm" && !still){
    if(S.flash <= 0 && Math.random() < .004) S.flash = .35;
    if(S.flash > 0){ g.fillStyle = `rgba(255,255,255,${S.flash*.8})`; g.fillRect(0,0,w,h); S.flash -= dt; }
  }
}
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
requestAnimationFrame(sceneFrame);

// ---- ma'lumot kartochkalari uchun jonli belgilar ----
function windSvg(ms){
  const dur = Math.max(.6, 3.2 - ms*.25).toFixed(2);
  return `<svg class="mini wind" viewBox="0 0 40 20" style="--dur:${dur}s" aria-hidden="true">
    <path d="M2 6h22a4 4 0 1 0-4-4"/><path class="w2" d="M2 11h30a4 4 0 1 1-4 4"/><path class="w3" d="M2 16h14"/></svg>`;
}
function humSvg(p){
  const y = 19 - 16*p/100;
  return `<svg class="mini hum" viewBox="0 0 20 22" aria-hidden="true">
    <defs><clipPath id="dropc"><path d="M10 1.5C6 7 3.5 10.5 3.5 14a6.5 6.5 0 0 0 13 0c0-3.5-2.5-7-6.5-12.5z"/></clipPath></defs>
    <path d="M10 1.5C6 7 3.5 10.5 3.5 14a6.5 6.5 0 0 0 13 0c0-3.5-2.5-7-6.5-12.5z" class="dropo"/>
    <g clip-path="url(#dropc)"><path class="wave" d="M-10 ${y} q2.5 -1.5 5 0 t5 0 t5 0 t5 0 t5 0 t5 0 t5 0 t5 0 V24 H-10z"/></g></svg>`;
}
function presSvg(mm){
  const k = Math.max(0, Math.min(1, (mm - 720)/60)), a = -90 + k*180;
  return `<svg class="mini pres" viewBox="0 0 40 22" aria-hidden="true">
    <path d="M4 20a16 16 0 0 1 32 0" class="arc"/>
    <g transform="translate(20 20)"><g class="needle" transform="rotate(${a})">${REDUCE?"":`<animateTransform attributeName="transform" type="rotate" values="${a};${a+5};${a-4};${a}" dur="3s" repeatCount="indefinite"/>`}<path d="M0 0V-13"/><circle r="2"/></g></g></svg>`;
}
function daySvg(sr, ss, now, isDay){
  const toMin = s => +s.slice(0,2)*60 + +s.slice(3,5);
  const k = Math.max(0, Math.min(1, (toMin(now) - toMin(sr)) / (toMin(ss) - toMin(sr))));
  const ang = Math.PI*(1-k), x = 20 + 16*Math.cos(ang), y = 20 - 16*Math.sin(ang);
  return `<svg class="mini sunarc" viewBox="0 0 40 22" aria-hidden="true">
    <path d="M4 20a16 16 0 0 1 32 0" class="arc dashed"/><path d="M2 20h36" class="ground"/>
    ${isDay ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" class="sdot"/>` : `<path d="M22 6a5 5 0 1 0 3 8 4 4 0 0 1-3-8z" class="mdot"/>`}</svg>`;
}
const r = n => Math.round(n);
const sign = n => (r(n)>0?"+":"")+r(n)+"°";

function load(key){ try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; } }
function save(key,v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }

async function getWeather(p){
  const u = new URL("https://api.open-meteo.com/v1/forecast");
  u.search = new URLSearchParams({
    latitude:p.lat, longitude:p.lon, timezone:"auto", forecast_days:16, wind_speed_unit:"ms",
    current:"temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,surface_pressure,is_day,cloud_cover,precipitation",
    hourly:"temperature_2m,weather_code,precipitation_probability,precipitation,wind_speed_10m,is_day",
    daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset"
  });
  const res = await fetch(u);
  if(!res.ok) throw new Error("server");
  return res.json();
}

let CUR = null;

// ---- kun ichiga kirish: soatma-soat ----
function rainSpans(idx, d){
  const spans = []; let s = null;
  idx.forEach((i,k) => {
    const wet = d.hourly.precipitation_probability[i] >= 40 || d.hourly.precipitation[i] >= 0.1;
    if(wet && s===null) s = i;
    if((!wet || k===idx.length-1) && s!==null){ spans.push([s, wet ? i : idx[k-1]]); s = null; }
  });
  return spans;
}
function openDay(i){
  if(!CUR) return;
  const {p, d} = CUR;
  const day = d.daily.time[i], dt = new Date(day+"T12:00");
  const idx = d.hourly.time.map((t,k) => t.startsWith(day) ? k : -1).filter(k => k>=0);
  const nowKey = d.current.time.slice(0,13);
  const name = i===0 ? "Bugun" : i===1 ? "Ertaga" : W[dt.getDay()];
  $("#sh-title").innerHTML = `${name}, ${dt.getDate()} ${M[dt.getMonth()]}<small>${p.name}${i>=7?" · taxminiy prognoz":""}</small>`;

  const spans = rainSpans(idx, d);
  const hh = k => d.hourly.time[k].slice(11,16);
  const end = k => { const h = (+d.hourly.time[k].slice(11,13)+1)%24; return String(h).padStart(2,"0")+":00"; };
  const total = idx.reduce((a,k) => a + (d.hourly.precipitation[k]||0), 0);
  let sum;
  if(spans.length){
    sum = `<div class="sum wet"><b>Yog'ingarchilik: ${spans.map(([a,b]) => `${hh(a)}–${end(b)}`).join(", ")}</b>
      <span>Kun bo'yi jami ${total.toFixed(1)} mm · eng yuqori ehtimol ${d.daily.precipitation_probability_max[i]}%</span></div>`;
  } else {
    sum = `<div class="sum"><b>Yog'ingarchilik kutilmaydi</b><span>${sign(d.daily.temperature_2m_min[i])} dan ${sign(d.daily.temperature_2m_max[i])} gacha</span></div>`;
  }

  const rows = idx.map(k => {
    const [ds, kind] = codeInfo(d.hourly.weather_code[k]);
    const pp = d.hourly.precipitation_probability[k], mm = d.hourly.precipitation[k];
    const wet = pp >= 40 || mm >= 0.1;
    const past = i===0 && d.hourly.time[k].slice(0,13) < nowKey;
    return `<div class="hr${wet?" wet":""}${past?" past":""}">
      <span class="tm">${hh(k)}</span>${icon(kind, d.hourly.is_day[k]===1)}
      <span class="ds">${ds}<small>Shamol ${d.hourly.wind_speed_10m[k].toFixed(0)} m/s</small></span>
      <span class="tt">${sign(d.hourly.temperature_2m[k])}</span>
      <span class="pr">${pp}%${mm>=0.1?`<br>${mm.toFixed(1)} mm`:""}</span></div>`;
  }).join("");

  $("#sh-body").innerHTML = sum + `<div class="hl" style="margin-top:14px">${rows}</div>`;
  const sh = $("#sheet");
  if(sh.hidden){ sh.hidden = false; history.pushState({day:i}, ""); }
  sh.scrollTop = 0;
  // bugun bo'lsa hozirgi soatga suriladi
  $("#back").focus({preventScroll:true});
}
function closeDay(){ $("#sheet").hidden = true; }
$("#back").addEventListener("click", () => history.state && history.state.day!==undefined ? history.back() : closeDay());
addEventListener("popstate", closeDay);
$("#app").addEventListener("click", e => { const r = e.target.closest("[data-day]"); if(r) openDay(+r.dataset.day); });
$("#app").addEventListener("keydown", e => { const r = e.target.closest("[data-day]"); if(r && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); openDay(+r.dataset.day); } });

function render(p, d){
  CUR = {p, d};
  const c = d.current, now = new Date(c.time);
  const [desc, kind] = codeInfo(c.weather_code);
  const mmHg = r(c.surface_pressure*0.750062);

  // soatlik: hozirgi soatdan 24 soat
  const hi = d.hourly.time.findIndex(t => t >= c.time.slice(0,13));
  const start = Math.max(0, hi);
  let hours = "";
  for(let i=start;i<start+24 && i<d.hourly.time.length;i++){
    const [, k] = codeInfo(d.hourly.weather_code[i]);
    const pp = d.hourly.precipitation_probability[i];
    hours += `<div class="h"><small>${i===start?"Hozir":d.hourly.time[i].slice(11,16)}</small>${icon(k, d.hourly.is_day[i]===1)}<span class="t">${sign(d.hourly.temperature_2m[i])}</span><small class="p">${pp>=20?pp+"%":"&nbsp;"}</small></div>`;
  }

  // kunlik
  const mins = d.daily.temperature_2m_min, maxs = d.daily.temperature_2m_max;
  const lo = Math.min(...mins), span = Math.max(...maxs) - lo || 1;
  let days = "";
  d.daily.time.forEach((t,i) => {
    const dt = new Date(t+"T12:00");
    const [dd, k] = codeInfo(d.daily.weather_code[i]);
    const name = i===0 ? "Bugun" : i===1 ? "Ertaga" : WS[dt.getDay()];
    const pp = d.daily.precipitation_probability_max[i];
    const left = (mins[i]-lo)/span*100, width = (maxs[i]-mins[i])/span*100;
    days += `<div class="d${i>=7?" far":""}" data-day="${i}" role="button" tabindex="0" aria-label="${name}, ${dd}. Soatma-soat ko'rish">
      <div class="dn">${name}<small>${dt.getDate()} ${M[dt.getMonth()].slice(0,3)}</small></div>
      ${icon(k)}
      <div class="dp">${pp>=20?pp+"%":""}</div>
      <div class="range"><span class="lo">${sign(mins[i])}</span><div class="bar"><i style="left:${left}%;width:${Math.max(width,4)}%"></i></div><span class="hi">${sign(maxs[i])}</span></div>
    </div>`;
  });

  const sr = d.daily.sunrise[0].slice(11,16), ss = d.daily.sunset[0].slice(11,16);
  $("#app").innerHTML = `
    <div class="now">
      <canvas id="sky" aria-hidden="true"></canvas>
      <div class="place">${p.name}${p.admin?", "+p.admin:""}</div>
      <div class="date">${W[now.getDay()]}, ${now.getDate()} ${M[now.getMonth()]} · ${c.time.slice(11,16)} holatiga</div>
      <div class="big"><span class="temp">${sign(c.temperature_2m)}</span>${icon(kind, c.is_day===1)}
        <div><div class="desc">${desc}</div><div class="date">Seziladi ${sign(c.apparent_temperature)} · bugun ${sign(mins[0])}…${sign(maxs[0])}</div></div></div>
      <div class="facts">
        <div>${windSvg(c.wind_speed_10m)}<b>${c.wind_speed_10m.toFixed(1)} m/s</b><span>Shamol</span></div>
        <div>${humSvg(c.relative_humidity_2m)}<b>${c.relative_humidity_2m}%</b><span>Namlik</span></div>
        <div>${presSvg(mmHg)}<b>${mmHg}</b><span>Bosim, mm</span></div>
        <div>${daySvg(sr, ss, c.time.slice(11,16), c.is_day===1)}<b>${sr}–${ss}</b><span>Kun</span></div>
      </div>
    </div>
    <h2>24 soat</h2>
    <div class="hours">${hours}</div>
    <h2>16 kun</h2>
    <div class="days">${days}</div>`;
  setScene(kind, c.is_day===1, c.wind_speed_10m, c.cloud_cover ?? 50, c.precipitation ?? 0);
}

async function show(p){
  save("place", p);
  try{ if(window.OsmonApp) OsmonApp.setPlace(p.name, p.lat, p.lon); }catch(e){}
  $("#res").hidden = true;
  const cached = load("wx2");
  if(cached && cached.lat===p.lat && cached.lon===p.lon) render(p, cached.data);
  else $("#app").innerHTML = '<p class="msg">Yuklanmoqda...</p>';
  try{
    const data = await getWeather(p);
    save("wx2", {lat:p.lat, lon:p.lon, data});
    render(p, data);
  }catch(e){
    if(!cached) $("#app").innerHTML = '<p class="msg">Internetga ulanib bo\'lmadi. Ulanishni tekshirib, sahifani yangilang.</p>';
  }
}

// shahar qidirish
let tmr;
$("#q").addEventListener("input", e => {
  clearTimeout(tmr);
  const q = e.target.value.trim();
  if(q.length < 2){ $("#res").hidden = true; return; }
  tmr = setTimeout(async () => {
    try{
      const u = `https://geocoding-api.open-meteo.com/v1/search?count=6&language=ru&name=${encodeURIComponent(q)}`;
      const j = await (await fetch(u)).json();
      const list = j.results || [];
      $("#res").innerHTML = list.length ? list.map((x,i) =>
        `<button type="button" data-i="${i}">${x.name} <small>${[x.admin1,x.country].filter(Boolean).join(", ")}</small></button>`).join("")
        : '<p class="msg">Topilmadi</p>';
      $("#res").hidden = false;
      $("#res").onclick = ev => {
        const b = ev.target.closest("button"); if(!b) return;
        const x = list[b.dataset.i];
        $("#q").value = "";
        show({name:x.name, admin:x.admin1||"", lat:x.latitude, lon:x.longitude});
      };
    }catch(err){}
  }, 350);
});

// koordinatadan joy nomi
async function placeName(lat, lon){
  try{
    const j = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=uz`)).json();
    const name = j.city || j.locality;
    if(name) return {name, admin: j.principalSubdivision || ""};
  }catch(e){}
  try{
    const j = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=12&accept-language=uz,ru&lat=${lat}&lon=${lon}`)).json();
    const a = j.address || {};
    const name = a.city || a.town || a.village || a.county || a.state;
    if(name) return {name, admin: a.state && a.state!==name ? a.state : ""};
  }catch(e){}
  return {name: `${lat.toFixed(2)}, ${lon.toFixed(2)}`, admin: ""};
}

// joylashuv
$("#loc").addEventListener("click", () => {
  if(!navigator.geolocation) return;
  $("#app").innerHTML = '<p class="msg">Joylashuv aniqlanmoqda...</p>';
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4);
    const place = await placeName(lat, lon);
    show({name: place.name || "Mening joyim", admin: place.admin || "", lat, lon});
  }, () => {
    $("#app").innerHTML = '<p class="msg">Joylashuvga ruxsat berilmadi. Telefon sozlamalarida brauzerga joylashuv ruxsatini yoqing yoki shaharni qidiring.</p>';
    $("#q").focus();
  }, {timeout:15000, enableHighAccuracy:false, maximumAge:600000});
});

show(load("place") || DEFAULT);
setInterval(() => { if(!document.hidden) show(load("place") || DEFAULT); }, 30*60*1000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) show(load("place") || DEFAULT); });

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
